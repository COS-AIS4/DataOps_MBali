name: DataOps Pipeline

on:
  push:
    branches:
      - tp-dataops
  pull_request:
    branches:
      - tp-dataops

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          pip --version  # Affiche la version de pip pour vérifier qu'il est bien à jour

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv venv  # Crée l'environnement virtuel
          source venv/bin/activate  # Active l'environnement virtuel
          pip install -r requirements.txt  # Installe les dépendances
          pip list  # Affiche la liste des modules installés dans l'environnement virtuel

      - name: Verify installation of requests
        run: |
          source venv/bin/activate  # Active l'environnement virtuel à nouveau
          python -m pip show requests  # Vérifie si 'requests' est installé
          pip freeze  # Affiche tous les modules installés pour vérifier

      - name: Run the DataOps pipeline
        run: |
          source venv/bin/activate  # Active l'environnement virtuel
          python main.py  # Exécute ton pipeline DataOps


