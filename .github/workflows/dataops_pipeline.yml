name: DataOps Pipeline

on:
  push:
    branches:
      - tp-dataops
  pull_request:
    branches:
      - tp-dataops

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip  # Met à jour pip

      - name: Install dependencies
        run: |
          python -m venv venv  # Crée un environnement virtuel
          source venv/bin/activate  # Active l'environnement virtuel
          pip install -r requirements.txt  # Installe les dépendances depuis requirements.txt

      - name: Verify installation of dependencies
        run: |
          python -m pip show requests  # Vérifie si le module 'requests' est installé
          pip freeze  # Affiche tous les modules installés

      - name: Run the DataOps pipeline
        run: |
          python main.py  # Exécute ton pipeline DataOps

