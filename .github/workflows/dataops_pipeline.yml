name: DataOps Pipeline

on:
  push:
    branches:
      - tp-dataops
  pull_request:
    branches:
      - tp-dataops

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # Spécifie la version de Python

        
       - name: Install dependencies
         run: |
           python -m venv venv
           venv/bin/pip install -r requirements.txt


      - name: Run the DataOps pipeline
        run: |
          python main.py

