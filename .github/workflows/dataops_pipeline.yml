name: DataOps Pipeline

on:
  push:
    branches:
      - tp-dataops
  pull_request:
    branches:
      - tp-dataops

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Mise à jour de l'action de checkout

      - name: Set up Python
        uses: actions/setup-python@v3  # Mise à jour de l'action de setup-python
        with:
          python-version: '3.8'  # Version spécifique de Python

      - name: Cache pip dependencies  # Ajout du cache pour pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Run the DataOps pipeline
        run: |
          venv/bin/python main.py  # Exécution avec l'environnement virtuel

