name: DataOps Pipeline

on:
  push:
    branches:
      - tp-dataops
  pull_request:
    branches:
      - tp-dataops

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'  # Spécifie Python 3.11

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run the DataOps pipeline
        run: |
          python main.py
