name: Data Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"  # Exécute tous les jours à 6h

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le repo
        uses: actions/checkout@v3

      - name: Installer Python et les dépendances
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - run: pip install -r requirements.txt

      - name: Récupérer les données
        run: python scripts/fetch_data.py

      - name: Générer les graphiques
        run: python scripts/visualize_data.py

